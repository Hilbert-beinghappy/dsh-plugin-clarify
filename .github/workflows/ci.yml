name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm t3
      - run: pnpm pack:check
  # T0 exit 0 means the probe wrote a report, not that (a)–(d) are 可行.
  # T1 standalone exit 0 means add/boot/remove/re-add passed. Task-book /doctor
  # is cross-project acceptance on Task B; missing stock dsh doctor must not fail CI.
  # Matrix pins rc.6 + rc.7 + rc.8 + 0.1.1-rc.2, then latest/next with exact-version dedupe.
  contract-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm t0:matrix
      - run: pnpm t1:matrix
